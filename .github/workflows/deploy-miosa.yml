name: Deploy MIOSA Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miosa-docs-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static SPA
        run: node scripts/build-spa.mjs

      - name: Install MIOSA CLI
        run: npm install -g @miosa/cli@2.16.0

      - name: Push release to MIOSA
        run: miosa deploy push miosa-docs --dir build-static --wait --json
        env:
          MIOSA_API_KEY: ${{ secrets.MIOSA_API_KEY }}
          MIOSA_WORKSPACE: default
