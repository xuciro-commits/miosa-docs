name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**/*.ts'
              - 'src/**/*.svelte'
              - 'vite*.config.ts'
              - 'package.json'
              - 'package-lock.json'

      - name: Type and accessibility check
        if: steps.changes.outputs.code == 'true'
        run: npm run check

      - name: Content and published-content check
        run: |
          npm run qa:content
          npm run qa:content:sync

      - name: Build
        run: npm run build:spa

      - name: Route and asset check
        run: npm run qa:routes

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-static
          path: build-static
          retention-days: 3

  deploy:
    needs: qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MIOSA_DEPLOYMENT_ID: c2325fd0-7617-485a-98e0-817374e9b131
      SITE_URL: https://docs.norsky.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-static
          path: build-static

      - name: Install MIOSA CLI
        run: npm install -g @miosa/cli@2.16.0

      - name: Upload version and verify the preview
        id: release
        env:
          MIOSA_API_KEY: ${{ secrets.MIOSA_API_KEY }}
        run: |
          miosa deploy push "$MIOSA_DEPLOYMENT_ID" --dir build-static --no-promote --wait --json > "$RUNNER_TEMP/miosa-release.json"
          version_id=$(jq -er '.data.version_id' "$RUNNER_TEMP/miosa-release.json")
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          miosa api GET "/deployments/$MIOSA_DEPLOYMENT_ID/versions/$version_id" > "$RUNNER_TEMP/miosa-version.json"
          preview_url=$(jq -er '.data.preview_url' "$RUNNER_TEMP/miosa-version.json")
          node scripts/verify-http.mjs "$preview_url" --sha "$GITHUB_SHA"

      - name: Promote and verify production
        env:
          MIOSA_API_KEY: ${{ secrets.MIOSA_API_KEY }}
          VERSION_ID: ${{ steps.release.outputs.version_id }}
        run: |
          miosa deploy promote "$VERSION_ID" --deployment "$MIOSA_DEPLOYMENT_ID" --json
          node scripts/verify-http.mjs "$SITE_URL" --sha "$GITHUB_SHA"
